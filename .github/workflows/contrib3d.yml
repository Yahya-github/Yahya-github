name: 3D contribution calendar

on:
  schedule:
    - cron: "57 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-write
  cancel-in-progress: false

jobs:
  contrib3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/3d-contrib.json
      - name: Commit if changed
        run: |
          git config user.name "sablenite-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh 3D contribution calendar"
          git pull --rebase && git push
