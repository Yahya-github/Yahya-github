name: Battle turn

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# No concurrency group: GitHub keeps only one *pending* run per group, so simultaneous moves
# would be cancelled. Instead each run replays its turn on the latest main and retries the push.
jobs:
  turn:
    if: startsWith(github.event.issue.title, 'battle|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Play and save turn
        # Untrusted input goes in via env only, never interpolated into the script.
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}   # owner skips the 1-minute cooldown for testing
        run: |
          git config user.name "sablenite-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            # Replay on the newest state every attempt, so a concurrent turn is never overwritten.
            git fetch -q origin main && git reset -q --hard origin/main
            rm -f game/comment.md   # never reply with a stale message from a previous attempt
            if ! python -m scripts.battle; then
              exit 0   # rejected move (cooldown/unknown): game/comment.md explains, nothing to save
            fi
            git add game/state.json assets/battle-*.svg README.md
            git commit -q -m "chore: battle turn by @${ISSUE_AUTHOR}"
            if git push -q origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another commit (attempt $attempt), replaying on latest main."
            sleep $((attempt * 2 + RANDOM % 3))
          done
          echo "The battle was too busy to save your move. Please open a new move in a minute." > game/comment.md
          exit 1
      - name: Reply and close
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          [ -f game/comment.md ] || echo "Something went wrong playing this turn." > game/comment.md
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file game/comment.md
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY"
