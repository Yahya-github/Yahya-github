name: Battle turn

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# One turn at a time so concurrent moves never overwrite game/state.json.
concurrency:
  group: battle
  cancel-in-progress: false

jobs:
  turn:
    if: startsWith(github.event.issue.title, 'battle|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Play turn
        id: play
        # Untrusted input goes in via env only, never interpolated into the script.
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          set +e
          python -m scripts.battle
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Commit turn
        if: steps.play.outputs.code == '0'
        env:
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "sablenite-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/state.json assets/battle-*.svg README.md
          git commit -m "chore: battle turn by @${ISSUE_AUTHOR}"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 3; done
      - name: Reply and close
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          [ -f game/comment.md ] || echo "Something went wrong playing this turn." > game/comment.md
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file game/comment.md
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY"
