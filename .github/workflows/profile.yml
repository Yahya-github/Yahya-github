name: Profile assets

on:
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "profile.toml", "sprites/**"]

permissions:
  contents: write

concurrency:
  group: profile-write
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Fine-grained PAT (read-only). Without it the API only sees public activity and the
      # stats silently drop (a 102-day streak shows as 3), so the build is skipped instead.
      PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
    steps:
      - name: Require PROFILE_TOKEN
        if: env.PROFILE_TOKEN == ''
        run: echo "::warning::PROFILE_TOKEN secret is missing; skipping so public-only numbers don't overwrite the profile."
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Regenerate terminal, stats, badges and battle
        if: env.PROFILE_TOKEN != ''
        run: python -m scripts.build
      - name: Commit if changed
        if: env.PROFILE_TOKEN != ''
        run: |
          git config user.name "sablenite-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets game/sableye.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile assets"
          git pull --rebase && git push
